site_name: slugkit
site_description: Tiny, dependency-free helpers for turning text into URL-friendly slugs.
site_url: https://noerith-hq.github.io/slugkit/

repo_url: https://github.com/noerith-hq/slugkit
repo_name: noerith-hq/slugkit
edit_uri: edit/main/docs/

# Internal template instructions, not part of the public site
exclude_docs: |
  PROJECT_SETUP.md

theme:
  name: material
  features:
    # Behave like an SPA
    - navigation.instant
    - navigation.instant.progress
    # Update anchors in the address bar
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mike
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  version:
    provider: mike
    # Preselected in the version menu; the first alias that exists wins
    default: [stable, latest]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/noerith-hq/slugkit
      name: slugkit on GitHub

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Usage: guide/usage.md
  - API reference: reference/api.md
  - Architecture:
      - Overview: architecture.md
      - Decisions:
          - Index: decisions/README.md
          - "0001: Documentation stack": decisions/0001-docs-stack-and-pages-deployment.md
  - Contributing: contributing.md
