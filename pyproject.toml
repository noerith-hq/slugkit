[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slugkit"
dynamic = ["version"]
description = "Tiny, dependency-free helpers for turning text into URL-friendly slugs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Noerith" }]
keywords = ["slug", "slugify", "url", "text"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
slugkit = "slugkit.__main__:main"

[project.urls]
Documentation = "https://noerith-hq.github.io/slugkit/"
Source = "https://github.com/noerith-hq/slugkit"
Issues = "https://github.com/noerith-hq/slugkit/issues"

[tool.hatch.version]
path = "src/slugkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/slugkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
